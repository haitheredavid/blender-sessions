name = "witch-frame"
created = "2026-10-10"
intent = "3D-printable shadow-box frame for a 9x12in witch illustration: concave bat-wing sides with flared corner tips, a face sloping from a thin outer edge into a deep sightwell, and a rabbet with turn clips for a 10x13in backboard."                   # what is this model, and what is it for?
status = "done"               # active | done (`blend model done` sets it)
workflows = ["mcp-modeling-loop", "ring-sweep-frame", "variant-grid-exploration", "print-fit-and-sectioning", "photo-to-texture", "render-views-and-sections", "animation", "print-handoff"]                # workflows/<name>.md used or written for this model
tags = ["3d-print", "frame", "stylized", "parametric", "halloween"]                     # e.g. ["hard-surface", "prop", "low-poly"]

[units]                       # applied by `blend model new`; 1 Blender unit = 1 m by default
scale_length = 0.001            # 0.001 + length_unit = "MILLIMETERS" for mm-scale work
length_unit = "MILLIMETERS"

[export]                      # `blend export`
formats = ["stl", "obj", "glb"]  # stl for the slicer; obj/glb for viewing
split = true                  # one file per part
collection = "Print"          # the 4 corner pieces, 4 loose tenons, 8 clips

[render]                      # `blend render` studio still -> render.png
# framing = "fit"             # fit: fill the frame; wide: show the floor around it
# scene = "Scene"             # scene to render (default: the saved one)

[print]                       # `blend print-pack` -> print/ handoff for bambi
collection = "Print"
printer = "Bambu Lab P1S"
bed = 256                     # mm, square
material = "PLA (matte)"
orientation = "as modelled: back face down on the bed; clips flat; tenons can lie on a long face"
hardware = [
  "8x M3x8 countersunk screws (turn clips), self-tapping into the 2.6 mm pilots",
]
assembly = [
  "Dry-fit the 4 corner pieces on a flat surface, face down.",
  "Glue a loose tenon into the top pieces first: Tenon_N into TL/TR's top seam, Tenon_E into Piece_TR, Tenon_W into Piece_TL; Tenon_S into the bottom seam (PLA-safe epoxy, slow CA, or wood glue fills the 0.15 mm gaps).",
  "Glue the seam faces and close each half along x (top pair over Tenon_N, bottom pair over Tenon_S), then close the halves along y over Tenon_E/W. Clamp flat, face down.",
  "Drop in glazing (2 mm), art on its 3 mm backboard, then screw the 8 turn clips over the backboard.",
]

[speckle]                     # /checkpoint publishes here; see .context/speckle-guide.md
account = "haitheredavid@gmail.com"   # chosen by email, never the connector's default
project_id = "de2b7457ae"     # app.speckle.systems project "blender-sessions"

[turntable]                   # `blend turntable` -> out/<model>-turntable.mp4 + .gif
frames = 120
fps = 30

# `blend views` shots. Model coords: face +Z, art top +Y; upright hangs it facing -Y.
[[views]]
name = "hero"                 # 3/4 as hung on a wall, art proxy in place
upright = true
include = ["Ref"]
azimuth = -62
elevation = 12

[[views]]
name = "front"                # straight on, as seen on the wall
upright = true
include = ["Ref"]
azimuth = -90
elevation = 0

[[views]]
name = "profile"              # side-on: thin 10 mm outer edge rising to 40 mm
upright = true
azimuth = -14
elevation = 0

[[views]]
name = "plan"                 # top-down, the sketch's view
azimuth = -90
elevation = 89

[[views]]
name = "back"                 # rabbet, clip pockets and clips
upright = true
azimuth = 118
elevation = 14

[[views]]
name = "corner"               # horn tip + cove + sightwell shadow, top-right
upright = true
include = ["Ref"]
azimuth = -55
elevation = 18
zoom = 4
target = [127, 163, 20]

[[views]]
name = "clip"                 # one turn clip over the backboard, from behind
upright = true
include = ["Ref"]
azimuth = 105
elevation = 30
zoom = 7
target = [92.8, 158.9, 3]
